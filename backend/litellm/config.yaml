# Rendered from the model registry by the Agent Platform admin UI. Do not hand-edit: apply a new
# registry version instead. Secrets are env references; mount them from Secret Manager (see platform docs).
model_list:
- model_name: gemini-2.5-flash
  litellm_params:
    model: vertex_ai/gemini-2.5-flash
    vertex_project: os.environ/VERTEX_PROJECT
    vertex_location: os.environ/VERTEX_LOCATION
  model_info:
    deploy: cloud
    group: fast
    provider: vertex_ai
- model_name: gemini-3-flash
  litellm_params:
    model: vertex_ai/gemini-3-flash-preview
    vertex_project: os.environ/VERTEX_PROJECT
    vertex_location: os.environ/VERTEX_LOCATION
  model_info:
    deploy: cloud
    group: fast
    provider: vertex_ai
- model_name: gemini-3.1-pro
  litellm_params:
    model: vertex_ai/gemini-3.1-pro-preview
    vertex_project: os.environ/VERTEX_PROJECT
    vertex_location: os.environ/VERTEX_LOCATION
  model_info:
    deploy: cloud
    group: reasoning
    provider: vertex_ai
- model_name: gemini-3-flash-budget
  litellm_params:
    model: vertex_ai/gemini-3-flash-preview
    vertex_project: os.environ/VERTEX_PROJECT
    vertex_location: os.environ/VERTEX_LOCATION
  model_info:
    deploy: cloud
    group: budget
    provider: vertex_ai
- model_name: nova-2-lite
  litellm_params:
    model: bedrock/nova-2-lite
    aws_region_name: os.environ/BEDROCK_REGION
    aws_role_name: os.environ/BEDROCK_ROLE_ARN
    aws_web_identity_token: os.environ/BEDROCK_WEB_IDENTITY_TOKEN
    aws_session_name: tcvgh-litellm
  model_info:
    deploy: cloud
    group: budget
    provider: bedrock
- model_name: gemma-4-12b
  litellm_params:
    model: ollama/gemma-4-12b
    api_base: http://10.140.0.31:11434
  model_info:
    deploy: onprem
    group: sovereign
    provider: ollama
- model_name: fast
  litellm_params:
    model: vertex_ai/gemini-2.5-flash
    vertex_project: os.environ/VERTEX_PROJECT
    vertex_location: os.environ/VERTEX_LOCATION
- model_name: reasoning
  litellm_params:
    model: vertex_ai/gemini-3.1-pro-preview
    vertex_project: os.environ/VERTEX_PROJECT
    vertex_location: os.environ/VERTEX_LOCATION
- model_name: budget
  litellm_params:
    model: vertex_ai/gemini-3-flash-preview
    vertex_project: os.environ/VERTEX_PROJECT
    vertex_location: os.environ/VERTEX_LOCATION
- model_name: sovereign
  litellm_params:
    model: ollama/gemma-4-12b
    api_base: http://10.140.0.31:11434
- model_name: smart-router
  litellm_params:
    model: auto_router/complexity_router
    complexity_router_config:
      tiers:
        SIMPLE: gemini-3-flash
        MEDIUM: gemini-2.5-flash
        COMPLEX: gemini-2.5-flash
        REASONING: gemini-3-flash
      classifier_type: heuristic
    complexity_router_default_model: gemini-2.5-flash
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120
  allowed_fails: 3
  cooldown_time: 60
  fallbacks:
  - fast:
    - gemini-3-flash
  - reasoning:
    - fast
  - budget:
    - nova-2-lite
    - fast
  context_window_fallbacks:
  - fast:
    - reasoning
litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 120
guardrails:
- guardrail_name: model-armor
  litellm_params:
    guardrail: model_armor
    mode: pre_call
    default_on: false
    template_id: os.environ/MODEL_ARMOR_TEMPLATE_ID
    project_id: os.environ/MODEL_ARMOR_PROJECT
    location: os.environ/MODEL_ARMOR_LOCATION
    mask_request_content: false
    fail_on_error: true
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
