[project]
name = "tcvgh-platform-api"
version = "0.1.0"
description = "TCVGH Agent Platform: Platform API + Agent Runtime (flow interpreter) on Cloud Run"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "firebase-admin>=6.5",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "google-cloud-dlp>=3.20",
    "google-auth>=2.34",
    "openai>=1.50",
    "httpx>=0.27",
    "google-cloud-agentplatform>=2.6",
    "python-multipart>=0.0.9",
    "google-cloud-secret-manager>=2.20",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# B008: `Depends()` in defaults is the documented FastAPI idiom.
ignore = ["B008"]
