# Build the Vite frontend and deploy it to Firebase Hosting (site: tcvgh-agent-builder).
# - push to main  -> live channel (https://tcvgh-agent-builder.web.app)
# - pull request  -> temporary preview channel, URL posted on the PR
# Secrets (GitHub repo settings -> Secrets and variables -> Actions):
#   FIREBASE_SERVICE_ACCOUNT_CLOUD_SA_SANDBOX_1  JSON key of github-firebase-deploy@cloud-sa-sandbox-1
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_APP_ID   from `firebase apps:sdkconfig WEB`
name: Deploy frontend to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - "mvp/frontend/**"
      - ".github/workflows/firebase-hosting.yml"
  pull_request:
    paths:
      - "mvp/frontend/**"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mvp/frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: cloud-sa-sandbox-1.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: cloud-sa-sandbox-1
          VITE_ALLOWED_DOMAIN: ikala.ai

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLOUD_SA_SANDBOX_1 }}
          projectId: cloud-sa-sandbox-1
          entryPoint: mvp/frontend
          # push / manual run -> live site; pull_request -> auto-named preview channel
          channelId: ${{ github.event_name == 'pull_request' && '' || 'live' }}
